[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Schema drift and anomaly detection for SQL Server databases."
requires-python = ">=3.11"
dependencies = ["pyodbc>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.6"]
azure = ["azure-identity>=1.17"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
ignore_missing_imports = true

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["driftwatch"]

[tool.coverage.report]
fail_under = 90
show_missing = true
