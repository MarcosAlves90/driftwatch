name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: pytest -q
      - run: pytest --cov=driftwatch --cov-report=term-missing --cov-fail-under=55 -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: npm run verify
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/driftwatch

  integration-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'Driftwatch-CI-Password-123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd " /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Driftwatch-CI-Password-123!' -C -Q 'SELECT 1' "
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ODBC driver and sqlcmd
        shell: bash
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor --output /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18
      - run: python -m pip install -e '.[dev]'
      - name: Seed integration schema
        env:
          SQLCMDPASSWORD: Driftwatch-CI-Password-123!
        run: |
          sqlcmd=(/opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -C)
          "${sqlcmd[@]}" -d master -Q "IF DB_ID(N'driftwatch_ci') IS NULL CREATE DATABASE driftwatch_ci"
          "${sqlcmd[@]}" -d driftwatch_ci -Q "IF OBJECT_ID(N'dbo.driftwatch_ci', N'U') IS NULL CREATE TABLE dbo.driftwatch_ci (id int IDENTITY(1,1) NOT NULL, name nvarchar(50) COLLATE Latin1_General_100_CI_AS NULL, CONSTRAINT CK_driftwatch_ci_name CHECK (name IS NULL OR LEN(name) > 0), CONSTRAINT UQ_driftwatch_ci_name UNIQUE (name))"
          "${sqlcmd[@]}" -d driftwatch_ci -Q "IF OBJECT_ID(N'dbo.driftwatch_ci_view', N'V') IS NULL EXEC(N'CREATE VIEW dbo.driftwatch_ci_view AS SELECT id, name FROM dbo.driftwatch_ci')"
          "${sqlcmd[@]}" -d driftwatch_ci -Q "SELECT COUNT(*) AS user_objects FROM sys.objects WHERE is_ms_shipped = 0"
      - name: Run real SQL Server collector test
        env:
          DRIFTWATCH_TEST_CONN_A: 'Driver={ODBC Driver 18 for SQL Server};Server=localhost,1433;Database=driftwatch_ci;UID=sa;PWD=Driftwatch-CI-Password-123!;TrustServerCertificate=yes'
          DRIFTWATCH_TEST_CONN_B: 'Driver={ODBC Driver 18 for SQL Server};Server=localhost,1433;Database=driftwatch_ci;UID=sa;PWD=Driftwatch-CI-Password-123!;TrustServerCertificate=yes'
        run: pytest -q tests/test_sqlserver_integration.py
